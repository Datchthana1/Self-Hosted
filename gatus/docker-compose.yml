services:
  gatus:
    image: twinproduction/gatus:v5.37.0
    restart: unless-stopped
    ports:
      - '8082:8080'
    environment:
      TZ: "Asia/Bangkok"
      GATUS_CONFIG_PATH: "/config"
      # System CAs + Let's Encrypt "YR1"/"Root YR" (missing from the image),
      # needed by air4thai.pcd.go.th — same fix as Air_Pipeline_2/Dockerfile
      SSL_CERT_FILE: "/certs/ca-bundle.crt"
    # API keys used as ${VAR} in config.yaml
    env_file: .env
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./config:/config:ro
      - ./data:/data
      - ./certs:/certs:ro
    networks:
      - default
      - npm
      - open-webui

networks:
  npm:
    name: nginx-proxy-manager_default
    external: true
  # To reach SearXNG, which has no host port
  open-webui:
    name: open-webui_default
    external: true
